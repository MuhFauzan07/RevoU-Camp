<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- ===== HEADER ===== -->
    <div class="page-header">
      <h1 class="page-title">Expense &amp; Budget Visualizer</h1>
      <button type="button" id="themeToggle" class="btn-theme" aria-label="Toggle dark/light mode">🌙</button>
    </div>

    <div class="page-wrapper">

      <!-- ===== BALANCE CARD ===== -->
      <div class="card balance-card">
        <p class="balance-label">TOTAL BALANCE</p>
        <p class="balance-amount" id="totalBalance">$0.00</p>
      </div>

      <!-- ===== ADD TRANSACTION FORM ===== -->
      <div class="card form-card">
        <h2 class="card-title">Add Transaction</h2>
        <form id="transactionForm" novalidate>

          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" autocomplete="off" maxlength="60">
            <span class="error-msg" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" min="0.01" step="0.01">
            <span class="error-msg" id="amountError"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error-msg" id="categoryError"></span>
          </div>

          <button type="submit" class="btn btn-add">Add Transaction</button>
        </form>
      </div>

      <!-- ===== BOTTOM ROW: list + chart ===== -->
      <div class="bottom-row">

        <!-- Transactions -->
        <div class="card list-card">
          <div class="list-header">
            <h2 class="card-title">Transactions</h2>
            <select id="sortSelect" class="sort-select" aria-label="Sort transactions">
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="amount-desc">Highest amount</option>
              <option value="amount-asc">Lowest amount</option>
              <option value="category-asc">Category A–Z</option>
            </select>
          </div>
          <ul id="transactionList" class="transaction-list" aria-live="polite"></ul>
          <p class="empty-msg" id="listEmptyMsg">No transactions yet.</p>
        </div>

        <!-- Chart -->
        <div class="card chart-card">
          <h2 class="card-title">Spending by Category</h2>
          <div class="chart-wrapper">
            <canvas id="spendingChart"></canvas>
          </div>
          <p class="empty-msg" id="chartEmptyMsg">Add transactions to see the chart.</p>
        </div>

      </div>

      <!-- Monthly Summary -->
      <div class="card summary-card">
        <div class="summary-header">
          <h2 class="card-title">Monthly Summary</h2>
          <div class="month-nav">
            <button type="button" id="prevMonth" class="btn-nav" aria-label="Previous month">&#8249;</button>
            <span id="currentMonthLabel" class="month-label"></span>
            <button type="button" id="nextMonth" class="btn-nav" aria-label="Next month">&#8250;</button>
          </div>
        </div>
        <div id="monthlySummaryContent" class="summary-grid"></div>
      </div>

    </div><!-- /page-wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
